spring:
  application:
    name: ticketflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketflow}
    username: ${DB_USERNAME:ticketflow}
    password: ${DB_PASSWORD:ticketflow}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: ticketflow
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.leonardo.ticketflow.kafka.event

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:https://ticketflow.local}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

ticketflow:
  reservation:
    expiration-interval-ms: ${RESERVATION_EXPIRATION_INTERVAL_MS:60000}
    lock:
      ttl: ${RESERVATION_LOCK_TTL:10m}
  kafka:
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
